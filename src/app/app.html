<div class="container" style="padding: 20px; font-family: Arial, sans-serif;">
  
  <h2>Завдання 1: Завантаження альбомів із JSONPlaceholder</h2>
  
  <!-- Показуємо цей блок, поки йде завантаження -->
  <div *ngIf="isLoading" style="padding: 20px; color: #004085; background-color: #cce5ff; border: 1px solid #b8daff; border-radius: 5px; text-align: center;">
    <strong>Зачекайте, дані завантажуються... ⏳</strong>
  </div>

  <!-- Показуємо список, тільки коли завантаження завершено -->
  <ul *ngIf="!isLoading">
    <li *ngFor="let album of albumsList" style="margin-bottom: 5px;">
    <strong>ID: {{ album.id }}</strong> (User ID: {{ album.userId }}) — {{ album.title }}
    </li>
  </ul>



<hr style="margin: 30px 0;">

  <h2>Завдання 2: Дані через клас Album (без userId)</h2>
  <ul style="background: #e6f7ff; padding: 15px; border-radius: 8px;">
    <!-- ПЕРЕВІРТЕ НАЯВНІСТЬ ЦЬОГО РЯДКА -->
    <li *ngFor="let album of albumsListTask2">
      <strong>ID: {{ album.id }}</strong> — {{ album.title }}
    </li>
  </ul>
